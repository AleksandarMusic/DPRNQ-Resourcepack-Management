name: Build Packs and Update Schema

on:
  push:
    branches: [ main ]
    paths:
      - 'uncompressed-packs/**'

permissions:
  contents: write

jobs:
  build-packs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed packs
        run: |
          BEFORE="${{ github.event.before }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git rev-parse "$BEFORE" >/dev/null 2>&1; then
            mapfile -t CHANGED < <(ls uncompressed-packs/ 2>/dev/null)
          else
            mapfile -t CHANGED < <(
              git diff --name-only "$BEFORE" HEAD -- uncompressed-packs/ \
                | awk -F/ 'NF > 1 {print $2}' | sort -u
            )
          fi
          printf '%s\n' "${CHANGED[@]}" > /tmp/changed_packs.txt
          cat /tmp/changed_packs.txt

      - name: Zip changed packs
        run: |
          mkdir -p resourcepacks
          while IFS= read -r raw_name; do
            [ -z "$raw_name" ] && continue
            [ -d "uncompressed-packs/$raw_name" ] || continue
            sanitized="${raw_name// /_}"
            rm -f "resourcepacks/$sanitized.zip"
            (cd "uncompressed-packs/$raw_name" && zip -r "../../resourcepacks/$sanitized.zip" .)
          done < /tmp/changed_packs.txt
          ls -la resourcepacks/

      - name: Merge pack entries into schema
        run: |
          python3 << 'EOF'
          import json, os, hashlib

          REPO = "${{ github.repository }}"

          schema = {"sync_version": 3, "sync": []}
          if os.path.exists('sms-schema.json'):
              with open('sms-schema.json') as f:
                  schema = json.load(f)

          # Preserve every non-resourcepack entry (i.e. mods)
          preserved = [e for e in schema["sync"] if e.get("type") != "resourcepack"]

          def short_hash(path, length=8):
              h = hashlib.sha256()
              with open(path, 'rb') as f:
                  for chunk in iter(lambda: f.read(8192), b''):
                      h.update(chunk)
              return h.hexdigest()[:length]

          pack_entries = []
          for filename in sorted(os.listdir('resourcepacks')):
              if not filename.endswith('.zip'):
                  continue
              pack_name = filename[:-4]
              display_name = pack_name.replace('_', ' ')
              version = short_hash(os.path.join('resourcepacks', filename))
              pack_entries.append({
                  "url": f"https://raw.githubusercontent.com/{REPO}/main/resourcepacks/{filename}",
                  "name": display_name,
                  "version": version,
                  "type": "resourcepack"
              })

          schema["sync"] = sorted(
              preserved + pack_entries,
              key=lambda e: e["name"].lower()
          )

          with open('sms-schema.json', 'w') as f:
              json.dump(schema, f, indent=2)

          print(f"Schema: {len(pack_entries)} pack(s), {len(preserved)} mod(s) preserved.")
          EOF

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A resourcepacks/ sms-schema.json
          git commit -m "Auto-build packs and update SMS schema" || echo "No changes to commit"
          git push