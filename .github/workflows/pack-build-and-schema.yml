name: Build Packs and Generate SMS Schema

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-schema:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Detect whether the uncompressed packs changed
      - name: Detect changes in uncompressed-packs
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            packs:
              - 'uncompressed-packs/**'

      # 3. Zip uncompressed packs (only if packs changed)
      - name: Zip uncompressed packs
        if: steps.filter.outputs.packs == 'true'
        run: |
          mkdir -p resourcepacks
          for pack_dir in uncompressed-packs/*/; do
            pack_name=$(basename "$pack_dir")
            echo "Zipping $pack_name..."
            (cd "$pack_dir" && zip -FSr "../../resourcepacks/$pack_name.zip" .)
          done
          echo "Generated zips:"
          ls -la resourcepacks/

      # 4. Generate the Simple Mod Sync schema (always runs)
      - name: Generate SMS schema
        run: |
          python3 << 'EOF'
          import json
          import os

          REPO = "${{ github.repository }}"
          SHA  = "${{ github.sha }}"

          packs = []
          for filename in sorted(os.listdir('resourcepacks')):
              if filename.endswith('.zip'):
                  pack_name = filename[:-4]  # strip the .zip extension
                  packs.append({
                      "url": f"https://raw.githubusercontent.com/{REPO}/main/resourcepacks/{filename}",
                      "name": pack_name,
                      "version": SHA,
                      "type": "resourcepack"
                  })

          schema = {
              "sync_version": 3,
              "sync": packs
          }

          with open('sms-schema.json', 'w') as f:
              json.dump(schema, f, indent=2)

          print(f"Generated schema with {len(packs)} pack(s), versioned at commit {SHA[:7]}.")
          EOF

      # 5. Commit the new zips and schema back to the repository
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A resourcepacks/ sms-schema.json
          git commit -m "Auto-build packs and update SMS schema" || echo "No changes to commit"
          git push