name: Update Mods in Schema

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'mods-config.json'

permissions:
  contents: write

jobs:
  update-mods:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve mod versions from Modrinth
        run: |
          python3 << 'EOF'
          import json, urllib.request, urllib.parse

          with open('mods-config.json') as f:
              config = json.load(f)

          game_version = config["game_version"]
          loader = config["loader"]

          def fetch_json(url):
              req = urllib.request.Request(
                  url, headers={"User-Agent": "sms-schema-workflow/1.0"}
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.load(resp)

          def split_filename(filename, version_number):
              for ext in ('.jar', '.zip'):
                  if filename.endswith(ext):
                      stem = filename[:-len(ext)]
                      break
              else:
                  stem = filename

              idx = stem.find(version_number)
              if idx > 0:
                  name = stem[:idx].rstrip('-_ .')
                  version = stem[idx:]
                  return name, version

              import re
              match = re.search(r'\d', stem)
              if match and match.start() > 0:
                  name = stem[:match.start()].rstrip('-_ .')
                  version = stem[match.start():]
                  return name, version

              return stem, version_number

          resolved = []
          for slug in config["mods"]:
              params = urllib.parse.urlencode({
                  "loaders": json.dumps([loader]),
                  "game_versions": json.dumps([game_version])
              })

              try:
                  versions = fetch_json(
                      f"https://api.modrinth.com/v2/project/{slug}/version?{params}"
                  )
              except Exception as e:
                  print(f"WARNING: could not fetch versions for {slug}: {e}")
                  continue

              releases = [v for v in versions if v.get("version_type") == "release"]
              if not releases:
                  print(f"WARNING: no release for {slug} on {game_version}/{loader}")
                  continue

              latest = releases[0]
              primary = next(
                  (f for f in latest["files"] if f.get("primary")),
                  latest["files"][0]
              )

              name, version = split_filename(
                  primary["filename"], latest["version_number"]
              )

              resolved.append({
                  "name": name,
                  "type": "mod",
                  "url": primary["url"],
                  "version": version
              })
              print(f"Resolved {slug}: name={name!r}, version={version!r}")

          with open('/tmp/resolved_mods.json', 'w') as f:
              json.dump(resolved, f, indent=2)
          print(f"\nTotal resolved: {len(resolved)}")
          EOF

      - name: Merge mod entries into schema with cleanup rules
        run: |
          python3 << 'EOF'
          import json, os, re

          # --- Load previous schema (before we overwrite it) ---
          prev_schema = {"sync": [], "modify": []}
          if os.path.exists('sms-schema.json'):
              with open('sms-schema.json') as f:
                  prev_schema = json.load(f)

          # --- Load newly resolved mods ---
          with open('/tmp/resolved_mods.json') as f:
              resolved = json.load(f)

          def project_id_from_url(url):
              """Extract Modrinth project ID from a CDN URL."""
              m = re.search(r'/data/([^/]+)/', url)
              return m.group(1) if m else None

          # --- Build a map of previous mod entries by project ID ---
          prev_mods_by_id = {}
          for entry in prev_schema.get("sync", []):
              if entry.get("type") != "mod":
                  continue
              pid = project_id_from_url(entry["url"])
              if pid:
                  prev_mods_by_id[pid] = entry

          # --- Preserve non-mod entries (resource packs, shaders, etc.) ---
          preserved = [e for e in prev_schema.get("sync", [])
                       if e.get("type") != "mod"]

          # --- Generate remove rules for outdated or removed mods ---
          remove_rules = []
          resolved_ids = set()

          for mod in resolved:
              pid = project_id_from_url(mod["url"])
              if not pid:
                  continue
              resolved_ids.add(pid)

              old = prev_mods_by_id.get(pid)
              if not old:
                  continue  # new mod, nothing to remove

              old_filename = f"{old['name']}-{old['version']}.jar"
              new_filename = f"{mod['name']}-{mod['version']}.jar"

              if old_filename != new_filename:
                  remove_rules.append({
                      "type": "remove",
                      "pattern": f"^mods/{re.escape(old_filename)}$",
                      "path": "."
                  })
                  print(f"Cleanup: {old_filename} -> {new_filename}")

          # --- Handle mods removed from config entirely ---
          for pid, old in prev_mods_by_id.items():
              if pid not in resolved_ids:
                  old_filename = f"{old['name']}-{old['version']}.jar"
                  remove_rules.append({
                      "type": "remove",
                      "pattern": f"^mods/{re.escape(old_filename)}$",
                      "path": "."
                  })
                  print(f"Cleanup (removed mod): {old_filename}")

          # --- Preserve existing non-mod modify rules ---
          existing_modify = prev_schema.get("modify", [])
          other_rules = [
              r for r in existing_modify
              if not (r.get("type") == "remove"
                      and r.get("pattern", "").startswith("^mods/"))
          ]

          # --- Build the new schema ---
          schema = {
              "sync_version": 3,
              "sync": sorted(preserved + resolved,
                             key=lambda e: e["name"].lower()),
              "modify": other_rules + remove_rules
          }

          with open('sms-schema.json', 'w') as f:
              json.dump(schema, f, indent=2)

          print(f"\nSchema: {len(resolved)} mod(s), {len(preserved)} preserved entry/entries.")
          if remove_rules:
              print(f"Added {len(remove_rules)} cleanup rule(s).")
          EOF

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sms-schema.json
          git commit -m "Update mods in SMS schema (with cleanup)" || echo "No changes to commit"
          git push