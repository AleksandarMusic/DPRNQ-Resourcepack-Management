name: Update Mods in Schema

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'mods-config.json'

permissions:
  contents: write

jobs:
  update-mods:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve mod versions from Modrinth
        run: |
          python3 << 'EOF'
          import json, urllib.request, urllib.parse, re

          with open('mods-config.json') as f:
              config = json.load(f)

          game_version = config["game_version"]
          loader = config["loader"]

          def fetch_json(url):
              req = urllib.request.Request(
                  url, headers={"User-Agent": "sms-schema-workflow/1.0"}
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.load(resp)

          def split_filename(filename, version_number):
              """
              Split a Modrinth filename into (name, version) such that
              f"{name}-{version}" reproduces the original filename stem.
              """
              for ext in ('.jar', '.zip'):
                  if filename.endswith(ext):
                      stem = filename[:-len(ext)]
                      break
              else:
                  stem = filename

              # Preferred: split where version_number appears
              idx = stem.find(version_number)
              if idx > 0:
                  name = stem[:idx].rstrip('-_ .')
                  version = stem[idx:]
                  return name, version

              # Fallback: split at first digit
              match = re.search(r'\d', stem)
              if match and match.start() > 0:
                  name = stem[:match.start()].rstrip('-_ .')
                  version = stem[match.start():]
                  return name, version

              # Last resort: keep as-is
              return stem, version_number

          resolved = []
          for slug in config["mods"]:
              params = urllib.parse.urlencode({
                  "loaders": json.dumps([loader]),
                  "game_versions": json.dumps([game_version])
              })

              try:
                  versions = fetch_json(
                      f"https://api.modrinth.com/v2/project/{slug}/version?{params}"
                  )
              except Exception as e:
                  print(f"WARNING: could not fetch versions for {slug}: {e}")
                  continue

              releases = [v for v in versions if v.get("version_type") == "release"]
              if not releases:
                  print(f"WARNING: no release for {slug} on {game_version}/{loader}")
                  continue

              latest = releases[0]
              primary = next(
                  (f for f in latest["files"] if f.get("primary")),
                  latest["files"][0]
              )

              name, version = split_filename(
                  primary["filename"], latest["version_number"]
              )

              resolved.append({
                  "name": name,
                  "type": "mod",
                  "url": primary["url"],
                  "version": version
              })
              print(f"Resolved {slug}:")
              print(f"  filename: {primary['filename']}")
              print(f"  -> name={name!r}, version={version!r}")

          with open('/tmp/resolved_mods.json', 'w') as f:
              json.dump(resolved, f, indent=2)
          print(f"\nTotal resolved: {len(resolved)}")
          EOF

      - name: Merge mod entries into schema
        run: |
          python3 << 'EOF'
          import json, os

          schema = {"sync_version": 3, "sync": []}
          if os.path.exists('sms-schema.json'):
              with open('sms-schema.json') as f:
                  schema = json.load(f)

          # Preserve every non-mod entry (i.e. resource packs)
          preserved = [e for e in schema["sync"] if e.get("type") != "mod"]

          with open('/tmp/resolved_mods.json') as f:
              mod_entries = json.load(f)

          schema["sync"] = sorted(
              preserved + mod_entries,
              key=lambda e: e["name"].lower()
          )

          with open('sms-schema.json', 'w') as f:
              json.dump(schema, f, indent=2)

          print(f"Schema: {len(mod_entries)} mod(s), {len(preserved)} pack(s) preserved.")
          for m in mod_entries:
              print(f"  - {m['name']} ({m['version']})")
          EOF

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sms-schema.json
          git commit -m "Update mods in SMS schema" || echo "No changes to commit"
          git push